# Run with:  docker compose up -d
#
# Two things here are not optional:
#   network_mode: host  — SSDP discovery is multicast, and multicast does not
#     cross Docker's bridge network. Without it the app finds no Sonos rooms.
#     (Docker Desktop for macOS and Windows has no real host networking, so the
#     container needs a Linux host.)
#   TZ — "Not played in 6 months" is a calendar boundary. On UTC it moves.

services:
  musicd-server:
    # Published for amd64, arm64 and arm/v7 on every push to main.
    # To build from source instead, comment this out and uncomment `build`.
    image: ghcr.io/meltface-80/musicd-server:latest
    # `docker compose pull` before `up -d` to update; compose, like docker run,
    # reuses a cached tag rather than checking the registry. Pin to a version
    # (e.g. :0.4.25) if you would rather update deliberately.
    pull_policy: always
    # build: https://github.com/meltface-80/MusicD-Server.git
    container_name: musicd-server
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/London
      MUSIC_DIRS: /music
      PORT: "3400"
      # Covers for albums that have none are looked for in the background,
      # from MusicBrainz and the Cover Art Archive. No key, no account.
      # Uncomment to switch it off for good; the app's own switch then goes
      # away too.
      # COVER_LOOKUP: "false"
      # The waveform in the Now playing seek bar. Worked out from your own
      # files with ffmpeg, once per track, and stored. Uncomment to switch it
      # off — worth it on a very small box, since a decode is the only thing
      # this server does that costs a CPU core.
      # WAVEFORM: "false"
      # Scrobbling to Last.fm. Last.fm has no anonymous mode, so this is the
      # one thing here that needs a registration — make a key once at
      # https://www.last.fm/api/account/create and put both values here. The
      # account itself is connected from the side menu, on Last.fm's own page.
      # LASTFM_API_KEY: your-key
      # LASTFM_API_SECRET: your-secret
    volumes:
      - /path/to/your/music:/music:ro
      - musicd-server-data:/app/data
      # The host's own clock, so the container agrees with it about today.
      - /etc/localtime:/etc/localtime:ro

volumes:
  musicd-server-data:
