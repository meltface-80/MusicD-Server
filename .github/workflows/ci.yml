name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check index.js
          node --check public/app.js
          for f in lib/*.js lib/*/*.js; do node --check "$f"; done
      - name: Tests (including the end-to-end run against a fake Sonos household)
        run: npm test

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: musicd-server:ci
      - name: Smoke test the image
        run: |
          mkdir -p /tmp/music
          docker run -d --name smoke -p 3500:3500 -v /tmp/music:/music:ro musicd-server:ci
          for i in $(seq 1 30); do curl -fs localhost:3500/api/health && break; sleep 1; done
          curl -fs localhost:3500/api/health | tee /dev/stderr | grep -q '"ffmpeg":true'
          curl -fs localhost:3500/ | grep -q "MusicD"
          docker logs smoke
          docker rm -f smoke
