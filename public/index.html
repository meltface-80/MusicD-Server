<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1d2125">
  <title>MusicD</title>

  <!-- DELIBERATELY ABSENT: apple-mobile-web-app-capable, mobile-web-app-capable,
       apple-mobile-web-app-status-bar-style. Modern iOS already opens a
       home-screen shortcut as a standalone web app, and viewport-fit=cover
       fills the display on its own. Adding the legacy apple-mobile-web-app-capable
       opts back into the OLD web-app path, where the status-bar style governs
       how the web view is inset, and the app stops reaching the edges — and iOS
       reads these at ADD-TO-HOME-SCREEN time, so a shortcut made against a bad
       build keeps the bad window forever. Same rule as MusicD Remote. -->
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-row">
      <button id="menu-toggle" class="icon-btn" aria-label="Menu" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <button id="topbar-back" class="icon-btn hidden" aria-label="Back to Home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <!-- Empty on Home. The wordmark is in the side menu, and repeating it
           over a screen that is plainly the app costs a line of the top bar
           that the screen names need on every other view. -->
      <h1 id="screen-title" class="screen-title"></h1>

      <div id="topbar-search" class="topbar-search">
        <button id="search-open" class="icon-btn" type="button" aria-label="Search" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <div class="search-row" id="search-row">
          <div class="search-box">
            <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="search-input" type="search" inputmode="search" autocomplete="off"
                   autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
                   placeholder="Search your library…" aria-label="Search your library">
            <button id="search-clear" class="search-clear" type="button" aria-label="Clear search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      </div>

    </div>

    <div id="scan-progress-bar" class="scan-progress-bar hidden" aria-hidden="true">
      <div id="scan-progress-fill" class="scan-progress-fill"></div>
    </div>
  </header>

  <!-- ---------------------------------------------------------------- -->
  <!--  Side menu                                                        -->
  <!-- ---------------------------------------------------------------- -->
  <div id="menu-overlay" class="menu-overlay hidden" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="menu-backdrop" data-close-menu></div>
    <nav class="menu-panel">
      <div class="menu-head">
        <img class="menu-brand" src="/icons/wordmark.svg" alt="MusicD" width="3908" height="1848">
        <button class="icon-btn" type="button" data-close-menu aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!--
        The panel's two views. Everything that is a PLACE stays on the first —
        Home, the artists index, and the home screen's rows. Everything that is
        a setting moved behind one button, because a menu that is nine
        preferences and seven destinations is a menu you have to read.

        Only this middle strip scrolls and only this strip swaps: the mark above
        and the library's counters below stay put, so what the library holds and
        which rooms are on the network are answerable without going anywhere.
      -->
      <div class="menu-scroll">
        <div id="menu-main">
          <button class="menu-item" type="button" data-go="home">Home</button>
          <button class="menu-item" type="button" data-go="artists">Artists</button>

          <!-- The home screen's rows, in the order the home screen shows them.
               Built by app.js from /api/rows rather than written out here,
               because the order is the user's and lives in the database — a
               list nailed into the markup could only ever be one of the two,
               and the two have to agree. Each one carries a pad you hold and
               drag to move it. -->
          <div id="menu-rows" class="menu-rows"></div>

          <div class="menu-sep"></div>

          <button class="menu-item" type="button" id="menu-settings-open"
                  aria-expanded="false" aria-controls="menu-settings">
            Settings
            <span class="menu-sub" id="settings-sub">Scanning, theme, covers and updates</span>
          </button>
        </div>

        <div id="menu-settings" class="hidden">
          <button class="menu-item menu-back" type="button" id="menu-settings-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Settings
          </button>

          <button class="menu-item" type="button" id="menu-rescan">
            Rescan library
            <span class="menu-sub" id="rescan-sub"></span>
          </button>
          <button class="menu-item" type="button" id="menu-theme">
            Theme
            <span class="menu-sub" id="theme-sub"></span>
          </button>
          <!-- Which control sits in the corner of Now playing, and so where
               leaving it takes you. See paintModalLeft() in app.js. -->
          <button class="menu-item" type="button" id="menu-npleft">
            Now playing button
            <span class="menu-sub" id="npleft-sub"></span>
          </button>
          <!-- A queue that does not run out. The genre row below only means
               anything while this is on, so it is absent while it is off —
               see showRadio() in app.js. -->
          <button class="menu-item" type="button" id="menu-radio">
            Random Album Radio
            <span class="menu-sub" id="radio-sub"></span>
          </button>
          <button class="menu-item hidden" type="button" id="menu-radio-genre">
            Match the current genre
            <span class="menu-sub" id="radio-genre-sub"></span>
          </button>
          <!-- The one thing this server asks the internet about, so it is the
               one thing with a switch. Hidden entirely when the container was
               started with COVER_LOOKUP=false — a switch that cannot do
               anything is worse than no switch. -->
          <button class="menu-item hidden" type="button" id="menu-covers">
            Find missing covers
            <span class="menu-sub" id="covers-sub"></span>
          </button>
          <!-- Hidden unless this container was given a Last.fm key. Last.fm has
               no anonymous mode, so without one there is nothing this row could
               do. -->
          <button class="menu-item hidden" type="button" id="menu-lastfm">
            Last.fm
            <span class="menu-sub" id="lastfm-sub"></span>
          </button>

          <button class="menu-item" type="button" id="menu-update">
            Check for updates
            <span class="menu-sub">Asks GitHub whether a newer release exists</span>
          </button>
          <button class="menu-item" type="button" id="menu-version">
            Version
            <span class="menu-sub" id="version-sub"></span>
          </button>
        </div>
      </div>

      <div class="menu-sep"></div>
      <div class="menu-foot" id="menu-foot"></div>
    </nav>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <!--  Main                                                             -->
  <!-- ---------------------------------------------------------------- -->
  <main>
    <div id="update-banner" class="update-banner hidden" role="status">
      <span class="update-text" id="update-text"></span>
      <button class="update-now" id="update-now" type="button">Update now</button>
      <a class="update-link" id="update-link" target="_blank" rel="noopener">Release notes</a>
      <button class="update-dismiss" id="update-dismiss" type="button" aria-label="Dismiss">Got it</button>
    </div>
    <div id="status-banner" class="status-banner hidden"></div>

    <section id="home-view" class="home-view" aria-label="Home">
      <div id="home-sections"></div>
    </section>

    <section id="grid-view" class="hidden" aria-label="Albums">
      <!-- The Library screen's order. Shown on that screen only: every other
           grid IS an order — "Recently added" sorted by artist would be a row
           that no longer means what its name says. -->
      <div id="sort-bar" class="sort-bar hidden">
        <button class="sort-ctl" id="sort-open" type="button" aria-haspopup="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M6 12h12M9 17h6"/>
          </svg>
          <span id="sort-label">Sort</span>
        </button>
        <button class="sort-ctl sort-dir" id="sort-dir" type="button">
          <span id="sort-dir-label"></span>
        </button>
      </div>
      <!-- The artist's biography. Filled only by the artist screen; every
           other grid leaves it hidden. -->
      <div id="artist-info" class="info hidden"></div>
      <div id="album-grid" class="album-grid" aria-live="polite"></div>
      <div id="grid-empty" class="grid-empty hidden"></div>
    </section>

    <section id="search-view" class="hidden" aria-label="Search results">
      <div id="search-results"></div>
    </section>

    <section id="artists-view" class="hidden" aria-label="Artists">
      <div id="artist-list" class="artist-list"></div>
    </section>
  </main>

  <!-- ---------------------------------------------------------------- -->
  <!--  Mini transport — play/pause, what is on, then room and volume     -->
  <!-- ---------------------------------------------------------------- -->
  <div id="mini" class="mini-transport hidden" aria-label="Now playing">
    <div class="mt-progress" aria-hidden="true"><div id="mt-fill" class="mt-progress-fill"></div></div>

    <button class="mt-btn mt-playpause" id="mt-playpause" aria-label="Play or pause">
      <svg id="mt-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg id="mt-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="hidden"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>

    <!-- Tapping the cover of what you are listening to gets you to it. -->
    <button id="mt-open" class="mt-info" type="button" aria-label="Open Now playing">
      <img id="mt-art" class="mt-art" alt="" aria-hidden="true">
      <span class="mt-text">
        <span id="mt-title" class="mt-title">—</span>
        <span id="mt-artist" class="mt-artist"></span>
      </span>
    </button>

    <div class="mt-controls">
      <button class="mt-btn" id="mt-zone" type="button" aria-label="Choose room">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="2.5" width="14" height="19" rx="2.5"/>
          <circle cx="12" cy="14" r="3.4"/><circle cx="12" cy="6.4" r="1.1"/>
        </svg>
      </button>
      <button class="mt-btn" id="mt-vol" type="button" aria-label="Volume" aria-expanded="false">
        <svg id="mt-icon-vol" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <svg id="mt-icon-mute" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="hidden"><path d="M4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.17v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73zM12 4 9.91 6.09 12 8.18z"/></svg>
      </button>
    </div>
  </div>


  <!-- ---------------------------------------------------------------- -->
  <!--  Choosing several albums at once                                  -->
  <!-- ---------------------------------------------------------------- -->
  <!-- Takes the mini bar's place rather than stacking above it: one bar at the
       foot of the screen, and while you are choosing albums that is the job in
       hand. It lives outside every view because the selection outlives the
       screen it started on — hold an album in one carousel, walk to another
       through Home, and carry on adding. -->
  <div id="select-bar" class="select-bar hidden" role="toolbar" aria-label="Selected albums">
    <span id="select-count" class="select-count" aria-live="polite">Tap albums to select</span>
    <div class="select-actions">
      <button id="select-play" class="select-btn is-primary" type="button">Play Now</button>
      <button id="select-queue" class="select-btn" type="button">Queue</button>
      <button id="select-cancel" class="select-btn is-quiet" type="button">Cancel</button>
    </div>
  </div>

  <!-- The mini bar's volume, just above the bar. Floating, not in flow: opening it must not move the screen
       underneath, which is the whole reason it is not a panel. -->
  <div class="vol-sheet mt-vol-sheet hidden" id="mt-vol-sheet" role="dialog" aria-label="Volume">
    <span class="vol-readout" aria-hidden="true">
      <span class="vol-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </span>
      <span class="vol-value" id="mt-vol-value">0</span>
    </span>
    <span class="vol-slider-wrap">
      <input type="range" id="mt-vol-range" class="vol-range" min="0" max="100" step="1" value="30" aria-label="Volume level">
      <span class="vol-scale" aria-hidden="true"><span>0</span><span>100</span></span>
    </span>
    <button class="vol-step" id="mt-vol-minus" type="button" aria-label="Volume down">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"/></svg>
    </button>
    <button class="vol-step" id="mt-vol-plus" type="button" aria-label="Volume up">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="12" x2="18" y2="12"/><line x1="12" y1="6" x2="12" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Now playing's volume, at the foot of that screen. Floating, not in flow: opening it must not move the screen
       underneath, which is the whole reason it is not a panel. -->
  <div class="vol-sheet np-vol-sheet hidden" id="np-vol-sheet" role="dialog" aria-label="Volume">
    <span class="vol-readout" aria-hidden="true">
      <span class="vol-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </span>
      <span class="vol-value" id="np-vol-value">0</span>
    </span>
    <span class="vol-slider-wrap">
      <input type="range" id="np-vol-range" class="vol-range" min="0" max="100" step="1" value="30" aria-label="Volume level">
      <span class="vol-scale" aria-hidden="true"><span>0</span><span>100</span></span>
    </span>
    <button class="vol-step" id="np-vol-minus" type="button" aria-label="Volume down">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"/></svg>
    </button>
    <button class="vol-step" id="np-vol-plus" type="button" aria-label="Volume up">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="12" x2="18" y2="12"/><line x1="12" y1="6" x2="12" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <!--  Album / Now playing panel                                        -->
  <!-- ---------------------------------------------------------------- -->
  <div id="album-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel">

      <div class="modal-head">
        <button class="icon-btn" id="modal-back" type="button" data-close-modal aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="icon-btn hidden" id="modal-home" type="button" aria-label="Go to Home screen" title="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/>
          </svg>
        </button>
        <div class="modal-tabs hidden" id="modal-tabs">
          <button class="modal-tab is-active" type="button" data-tab="np">Now playing</button>
          <button class="modal-tab" type="button" data-tab="queue">Queue</button>
        </div>
        <!-- The album face gets the heart, Now playing keeps the share card.
             One corner, two jobs, and which one is showing follows the face. -->
        <button class="icon-btn" id="modal-fave" type="button"
                aria-label="Favourite" aria-pressed="false" title="Favourite">
          <!-- Hollow until it is one: stroked, no fill. The fill and the colour
               both arrive with .is-on. -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.8 5.6a5.1 5.1 0 0 0-7.2 0L12 7.2l-1.6-1.6a5.1 5.1 0 0 0-7.2 7.2l1.6 1.6L12 21.6l7.2-7.2 1.6-1.6a5.1 5.1 0 0 0 0-7.2z"/>
          </svg>
        </button>
        <button class="icon-btn hidden" id="modal-share" type="button" aria-label="Share card" title="Share card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- ---------------- Album face ---------------- -->
        <div id="album-face">
          <!-- The sleeve, and the one control that sits on it. The wrapper is
               what the menu is positioned against: .modal-art clips to its own
               rounded corners, so a menu inside it would be cut off by them. -->
          <div class="modal-art-wrap">
            <div class="modal-art"><img id="modal-img" alt=""></div>
            <button class="art-more" id="album-more" type="button"
                    aria-label="More for this album" aria-haspopup="true" aria-expanded="false"
                    title="More">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/>
                <circle cx="19" cy="12" r="1.9"/>
              </svg>
            </button>
            <!-- The catch travels with the menu so the two cannot be shown
                 separately: a tap that dismisses must not also land on the
                 track row or the Play button underneath it. -->
            <div class="art-menu-layer hidden" id="album-menu">
              <div class="art-menu-catch" data-menu-close></div>
              <div class="art-menu" role="menu" aria-labelledby="album-more">
                <button class="art-menu-item" id="album-edit" type="button" role="menuitem">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 7.5 16.5 9.5"/>
                  </svg>
                  <span>Edit</span>
                </button>
              </div>
            </div>
          </div>
          <div class="modal-info">
            <h2 id="modal-title">—</h2>
            <div id="modal-subtitle" class="modal-subtitle"></div>
            <div id="modal-stats" class="modal-stats"></div>
            <div class="modal-actions">
              <button id="btn-play" class="action-btn primary" type="button">Play</button>
              <button id="btn-queue" class="action-btn" type="button">Queue</button>
            </div>
            <!-- One record the library holds more than one copy of: the
                 standard album and its deluxe reissue are one screen with a
                 tab each. Built by app.js from the album's versions and
                 hidden when there is only one, which is nearly always. -->
            <div id="album-versions" class="version-tabs hidden" role="tablist"
                 aria-label="Versions of this album"></div>
            <div class="section-label" id="tracks-label">Tracks</div>
            <ol id="track-list" class="track-list"></ol>
            <!-- What Wikipedia says about the record. UNDER the track list on
                 purpose: the list is what the screen was opened for, and this
                 arrives from the network a moment later. -->
            <div id="album-info" class="info hidden"></div>
          </div>
        </div>

        <!-- ---------------- Now playing ---------------- -->
        <div id="np-screen" class="np-screen hidden">
          <div class="np-art"><img id="np-img" alt=""></div>

          <!-- Everything that is not the artwork. In the phone's single column
               this is display:contents and changes nothing; on a landscape
               screen it becomes the second column beside the art. -->
          <div class="np-info">
          <div class="np-track" id="np-track">—</div>
          <div class="np-artist" id="np-artist"></div>
          <button class="np-album" id="np-album" type="button"></button>

          <div class="np-progress" id="np-progress">
            <!-- The shape of the track, drawn UNDER the range input and never
                 in place of it: the input keeps the drag, the keyboard, the
                 thumb and the disabled state, and if any of this fails the bar
                 is exactly what it was before. Local files only, which here is
                 every file — this server has nothing else to play. -->
            <canvas id="np-wave" class="np-wave hidden" aria-hidden="true"></canvas>
            <input type="range" id="np-seek" class="np-seek" min="0" max="100" step="1" value="0" aria-label="Seek">
            <div class="np-times">
              <span id="np-cur" class="np-time">0:00</span>
              <span id="np-tot" class="np-time">0:00</span>
            </div>
          </div>

          <div class="np-transport">
            <!-- DELIBERATELY ABSENT: shuffle and repeat. Removed on request —
                 an album is listened to in the order it was sequenced, and the
                 two controls that undo that were taking the outside positions
                 in a row of three that does the actual work. The play modes
                 are still read and reported by the server; nothing here sets
                 them, so a mode set in the Sonos app is left alone. -->
            <button class="np-btn" id="np-prev" type="button" aria-label="Previous track">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3 6 9 6V6z"/></svg>
            </button>
            <button class="np-btn np-playpause" id="np-playpause" type="button" aria-label="Play or pause">
              <svg id="np-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg id="np-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="hidden"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>
            <button class="np-btn" id="np-next" type="button" aria-label="Next track">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l9-6-9-6z"/></svg>
            </button>
          </div>

          <div class="np-secondary">
            <button class="np-mini-btn" id="np-device" type="button" aria-label="Choose room">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="2.5" width="14" height="19" rx="2.5"/>
                <circle cx="12" cy="14" r="3.4"/><circle cx="12" cy="6.4" r="1.1"/>
              </svg>
            </button>
            <span class="np-room" id="np-room"></span>
            <button class="np-mini-btn" id="np-volbtn" type="button" aria-label="Volume" aria-expanded="false">
              <svg id="np-icon-vol" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
              <svg id="np-icon-mute" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="hidden"><path d="M4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.17v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73zM12 4 9.91 6.09 12 8.18z"/></svg>
            </button>
          </div>
          </div><!-- /.np-info -->
        </div>

        <!-- ---------------- Queue ---------------- -->
        <div id="queue-pane" class="queue-pane hidden">
          <div class="queue-summary" id="queue-summary"></div>
          <div class="queue-earlier" id="queue-earlier"></div>
          <ol id="queue-list" class="queue-list"></ol>
          <div class="queue-empty hidden" id="queue-empty">Nothing is queued in this room.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <!--  Room picker                                                      -->
  <!-- ---------------------------------------------------------------- -->
  <div id="zone-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Rooms">
    <div class="sheet-backdrop" data-close-sheet></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <span>Rooms</span>
        <button class="icon-btn" type="button" id="zone-refresh" aria-label="Look for rooms again" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
      </div>
      <div id="zone-list" class="zone-list"></div>
      <div id="zone-note" class="zone-note"></div>
    </div>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <!--  Share card                                                       -->
  <!-- ---------------------------------------------------------------- -->
  <div id="share-overlay" class="share-overlay hidden" role="dialog" aria-modal="true" aria-label="Share card">
    <div class="share-backdrop" data-share-close></div>
    <div class="share-panel">
      <button class="share-close icon-btn" type="button" data-share-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="share-frame" id="share-frame">
        <div class="share-placeholder"><div class="share-spinner"></div><div>Generating card…</div></div>
      </div>
      <div class="share-actions" id="share-actions"></div>
      <p class="share-hint" id="share-hint"></p>
      <p class="share-err" id="share-err"></p>
    </div>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <!--  How the Library screen is ordered                                -->
  <!-- ---------------------------------------------------------------- -->
  <!-- A sheet rather than a menu on the bar: the bar repaints when the order
       changes, and a list that rebuilds under a finger mid-tap is how the
       wrong sort gets chosen. -->
  <div id="sort-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Sort albums by">
    <div class="sheet-backdrop" data-close-sort></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <span>Sort by</span>
        <button class="icon-btn" type="button" data-close-sort aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="sort-list" class="zone-list"></div>
    </div>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <!--  Correcting an album's name                                       -->
  <!-- ---------------------------------------------------------------- -->
  <!-- Anchored near the TOP rather than centred, and deliberately: this is
       the only screen in the app with a text field on it that is not the
       search bar, and a panel in the middle of a phone is a panel under the
       keyboard. Nothing here has a `bottom:`, so there is no --kb-inset to
       subtract — the keyboard opens below it and covers nothing. -->
  <div id="edit-overlay" class="edit-overlay hidden" role="dialog" aria-modal="true"
       aria-labelledby="edit-heading">
    <div class="edit-backdrop" data-edit-close></div>
    <div class="edit-panel">
      <h2 class="edit-heading" id="edit-heading">Edit album</h2>

      <label class="edit-field">
        <span class="edit-label">Album</span>
        <input id="edit-title" type="text" autocomplete="off" autocapitalize="words"
               autocorrect="off" spellcheck="false" enterkeyhint="done">
      </label>

      <label class="edit-field">
        <span class="edit-label">Artist</span>
        <input id="edit-artist" type="text" autocomplete="off" autocapitalize="words"
               autocorrect="off" spellcheck="false" enterkeyhint="done">
      </label>

      <!-- Both halves matter. The first is how a correction is undone without a
           third button to undo it; the second is the promise the whole app is
           built on, said where somebody is about to doubt it. -->
      <p class="edit-note">Clear a field to go back to what the file tags say.
        Your music files are never changed.</p>
      <p class="edit-err hidden" id="edit-err"></p>

      <!-- Looking for a cover, from the same dialog the name is corrected in.
           The two belong together: the album the automatic sweep cannot find is
           almost always the one whose tags do not say who made it, and the fix
           is to type the name and then look with it. -->
      <div class="edit-cover">
        <div class="edit-cover-head">
          <span class="edit-label">Cover</span>
          <button class="action-btn" type="button" id="edit-find">Find cover</button>
        </div>
        <!-- What the automatic search recorded when it gave up, so "still
             missing and nothing is happening" has an answer on screen. -->
        <p class="edit-why hidden" id="edit-why"></p>
        <div class="edit-grid hidden" id="edit-grid"></div>
      </div>

      <div class="edit-actions">
        <button class="action-btn" type="button" id="edit-cancel" data-edit-close>Cancel</button>
        <button class="action-btn primary" type="button" id="edit-save">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script src="/sharecard.js"></script>
<script src="/app.js"></script>
</body>
</html>
